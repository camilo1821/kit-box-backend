# =====================================================================
# Kit-Box E-commerce - Configuración de la aplicación
# =====================================================================

# Nombre de la aplicación
spring.application.name=ecommerce

# --- Conexión a la base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/db_pruebKit
spring.datasource.username=root
spring.datasource.password=Dlov.931215

# --- Hibernate / JPA ---
# "create" borra y recrea las tablas en cada inicio (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=create

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

# Dialecto de MySQL para generar SQL compatible
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Formatear el SQL en los logs para mayor legibilidad
spring.jpa.properties.hibernate.format_sql=true